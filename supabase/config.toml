# Minimal Supabase CLI config. The project itself is linked with `supabase link`.
project_id = "app-ich"

# Every function checks the login itself (auth.getUser), so the gateway check is
# off. This also works with Supabase's newer asymmetric JWT signing keys.
[functions.coach]
verify_jwt = false

# The iPhone calendar subscribes without logging in (private token in the link).
[functions.calendar]
verify_jwt = false

# Called by the GitHub schedule (shared secret) and by the app (checks the login itself).
[functions.push]
verify_jwt = false

[functions.account]
verify_jwt = false

[functions.voice]
verify_jwt = false
