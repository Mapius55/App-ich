name: Deploy Supabase (Datenbank + Coach)

# Bringt Datenbank-Schema und Server-Funktionen automatisch auf Supabase,
# sobald sich unter supabase/ etwas ändert. Einmalig einrichten (Repository →
# Settings → Secrets and variables → Actions):
#   Variable  SUPABASE_PROJECT_REF   z.B. abcdefghijklmnop (aus der Projekt-URL)
#   Secret    SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   Secret    SUPABASE_DB_PASSWORD   das Datenbank-Passwort des Projekts
#   Secret    ANTHROPIC_API_KEY      Schlüssel von platform.claude.com
#   Secret    PUSH_CRON_SECRET       ein beliebiges langes Passwort (für Benachrichtigungen)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Datenbank-Schema
        run: supabase db push
      - name: Geheimnisse setzen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$PUSH_CRON_SECRET" ] && args+=("PUSH_CRON_SECRET=$PUSH_CRON_SECRET")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - name: Funktionen
        run: |
          supabase functions deploy coach --project-ref "$PROJECT_REF"
          supabase functions deploy account --project-ref "$PROJECT_REF"
          supabase functions deploy calendar --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy push --no-verify-jwt --project-ref "$PROJECT_REF"
